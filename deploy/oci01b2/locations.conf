root /usr/share/nginx/html;
location = /proxy-health { access_log off; return 200 'ok'; }
location = /api { return 404; }
location ^~ /api/ {
    # Trailing slash strips exactly /api/; API errors never fall through to SPA.
    proxy_pass http://clp_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Tailscale-User-Login "";
    proxy_set_header Tailscale-User-Name "";
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_read_timeout 45s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
